<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#F9FAFF" />
    <title>neo POCS</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- 휴대폰 '홈 화면에 추가': 주소창 없이 앱처럼 (안드로이드 전체화면 · 아이폰 standalone) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="neo POCS" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <link rel="stylesheet" href="/src/styles/screens.css" />
    <link rel="stylesheet" href="/src/styles/night.generated.css" />
    <link rel="stylesheet" href="/src/styles/night.css" />
  </head>
  <body>
    <div id="root" data-bg="splash">
      <div id="viewport">
        <div id="stage">
          <div id="screens"></div>
          <div id="sheet-layer"></div>
          <div id="toast" role="status" aria-live="polite"></div>
          <div class="fake-status" aria-hidden="true">
            <span>9:30</span>
            <span class="icons">
              <img src="/src/assets/icons/status-wifi.svg" alt="" style="left: 0; width: 17px; height: 17px" />
              <img src="/src/assets/icons/status-signal.svg" alt="" style="left: 16px; width: 17px; height: 17px" />
              <img src="/src/assets/icons/status-battery.svg" alt="" style="left: 38px; top: 1px; width: 8px; height: 15px" />
            </span>
          </div>
          <div class="fake-handle" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
