<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- 3D-style tile: same white glossy rounded square as the Figma icon set -->
  <defs>
    <linearGradient id="vm-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f7f8fb"/>
      <stop offset="1" stop-color="#e6e9f0"/>
    </linearGradient>
    <linearGradient id="vm-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d5dae4"/>
    </linearGradient>
    <linearGradient id="vm-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cb7ff"/>
      <stop offset="0.45" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4fd8"/>
    </linearGradient>
    <linearGradient id="vm-holder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfdcf7"/>
      <stop offset="1" stop-color="#93a9dc"/>
    </linearGradient>
    <linearGradient id="vm-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9bce6"/>
      <stop offset="1" stop-color="#6f86c4"/>
    </linearGradient>
    <radialGradient id="vm-dot" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ff9db0"/>
      <stop offset="0.55" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#d6264a"/>
    </radialGradient>
    <filter id="vm-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8d97ad" flood-opacity="0.35"/>
    </filter>
    <filter id="vm-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#1d3f9a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="6" y="4" width="108" height="108" rx="27" fill="url(#vm-edge)" filter="url(#vm-shadow)"/>
  <rect x="8" y="6" width="104" height="103" rx="25.5" fill="url(#vm-tile)"/>
  <!-- holder arc + stem + base -->
  <path d="M38 55c0 13.3 9.8 22.5 22 22.5S82 68.3 82 55" fill="none" stroke="url(#vm-holder)" stroke-width="6" stroke-linecap="round"/>
  <rect x="56.5" y="76" width="7" height="12" rx="2.5" fill="url(#vm-holder)"/>
  <rect x="43" y="86" width="34" height="8.5" rx="4.25" fill="url(#vm-base)" filter="url(#vm-soft)"/>
  <!-- microphone capsule -->
  <g filter="url(#vm-soft)">
    <rect x="45" y="20" width="30" height="50" rx="15" fill="url(#vm-head)"/>
  </g>
  <path d="M49 33h22M49 40h22M49 47h22" stroke="#bcd8ff" stroke-opacity="0.55" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M52 24.5c-3.4 2.4-4.8 6-4.8 10.5v14" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3.2" stroke-linecap="round"/>
  <!-- recording dot -->
  <circle cx="86" cy="27" r="8" fill="url(#vm-dot)"/>
  <circle cx="83.6" cy="24.6" r="2.4" fill="#ffffff" fill-opacity="0.8"/>
</svg>
